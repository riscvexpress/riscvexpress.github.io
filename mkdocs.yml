site_name: RISC-V eXpress
site_url: https://riscvexpress.github.io/
site_description: RISC-V eXpress (RVX)
copyright: Copyright &copy; ETRI, South Korea

use_directory_urls: false

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - ARX:
      - arx/index.md
      - Repository Setup: arx/arx-repository-manual-en.md
      - CLI Manual:
          - Overview: arx/arx-cli-manual-en.md
          - Platform: arx/arx-cli-manual-en-platform.md
          - Application: arx/arx-cli-manual-en-app.md
          - RTL Simulation: arx/arx-cli-manual-en-simulation.md
          - FPGA Prototyping: arx/arx-cli-manual-en-fpga.md
      - Software Development:
          - Overview: arx/arx-sw-manual-en.md
          - Caching Region Assignment: arx/arx-sw-manual-en-caching.md
          - Data Consistency: arx/arx-sw-manual-en-consistency.md
          - Standard Library Porting: arx/arx-sw-manual-en-stdlib.md
          - Miscellaneous: arx/arx-sw-manual-en-misc.md
